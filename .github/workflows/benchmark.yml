name: VJSS Quality Benchmark & Creator Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: 100-Point Quality & Creator Guard Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run VJSS Quality & Creator Protection Suite
        run: |
          python3 tests/benchmark_suite.py
