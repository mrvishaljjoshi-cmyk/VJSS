[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vjss"
version = "2.3.0"
description = "Universal AI Agent Super-Skills Ecosystem by Mr. Vishalkumar Joshi (130 Plain-Text Engineering Protocols)"
readme = "README.md"
authors = [{ name = "Mr. Vishalkumar Joshi", email = "mrvishaljjoshi@gmail.com" }]
license = { text = "MIT" }
keywords = ["ai-agents", "claude-code", "cursor-rules", "windsurf-rules", "prompt-engineering", "antigravity", "vjss"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://vjprojects.co.in"
Repository = "https://github.com/mrvishaljjoshi-cmyk/VJSS"
Documentation = "https://github.com/mrvishaljjoshi-cmyk/VJSS#readme"

[project.scripts]
vjss = "vjss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
